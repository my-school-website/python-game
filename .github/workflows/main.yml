```yaml
name: Python Game

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python file
        run: python -m py_compile database_game.py

      - name: Run basic test
        run: |
          python -c "import database_game; print('Game loaded successfully!')"
```
